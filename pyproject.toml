[project]
name = "convgamer"
version = "0.1.0"
description = "InceptionNeXt: When Inception Meets ConvNeXt — a CNN research project"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Joao Gabriel Souza Amaral", email = "jgsa75005@gmail.com" }
]
keywords = ["pytorch", "deep-learning", "research", "convnext", "inception", "cv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "safetensors>=0.4.0",
    "tqdm>=4.66.0",
    "pytorch-lightning>=2.3.0",
    "taichi>=1.7.0",
    "transformers>=4.45.0",
    "huggingface-hub>=0.25.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=0.20.0",
]
cu124 = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=0.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "jupytext>=1.15.1,<1.16.0",
    "ipykernel>=6.29.0",
    "nbconvert>=7.16.0",
]

[project.scripts]
train = "convgamer.scripts.train:main"
eval = "convgamer.scripts.eval:main"
export-hf = "convgamer.scripts.export_hf:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu124" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pyrefly]
output-format = "full-text"
module-path = ["src"]
ignore-modules = [
    "torch._torch_compile",
    "torch.ao",
    "torch.autograd",
    "torch.contrib",
    "torch.cuda",
    "torch.distributed",
    "torch.distributions",
    "torch.fft",
    "torch.functorch",
    "torch.hub",
    "torch.linalg",
    "torch.library",
    "torch.nn",
    "torch.nn.utils.parametrize",
    "torch.optim",
    "torch.testing",
    "torch.utils.checkpoint",
    "torch.utils.cpp_extension",
    "torch.utils.data",
]
report-error-codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
