# V-JEPA 2.1 ConvGamer model config
# ConvGamerEncoder is a foundation model (no classification head)
target: convgamer.models.jepa  # marker for build_model() JEPA dispatch

encoder:
  _target_: convgamer.models.convgamer.encoder.ConvGamerEncoder
  input_dim: 3
  hidden_dim: 96
  num_layers: [3, 3, 9, 3]   # InceptionNeXt-Tiny stage layout
  num_classes: null          # Foundation model — no head (added later)
  layer_scale_init: 1e-6
  mlp_ratios: [4, 4, 4, 3]
  out_factor: 2
  temporal_dilations: [1, 2, 4]

# V-JEPA 2.1 predictor (§2.3.1, §2.3.2): local-conv stack, 4 level outputs
predictor:
  _target_: convgamer.models.jepa.VJEPAPredictor
  feature_dim: 256           # must match encoder level_dim (fused level width)
  predictor_dim: 384
  num_layers: 4              # local conv blocks (train-time only)
  num_outputs: 4             # one prediction per encoder level
  expansion: 4               # MLP expansion in predictor blocks

# Loss: JEPA dense loss + LeJEPA isotropy pressure (arXiv:2511.08544).
loss:
  _target_: convgamer.models.jepa.JEPALoss
  lambda_base: 0.5          # video lambda (0.5 video, 0.7 image per Appendix A)
  lambda_image: 0.7         # static-image (T=1) context weight
  lambda_warmup_steps: 30000  # paper's epochs 50-100 ramp (~30k steps at 135k)
  sigreg_lambda: 0.02      # isotropy weight on predicted latents (paper goto); 0 disables
  sigreg_slices: 256       # random 1D slices per step (paper)
  sigreg_tokens: 2048      # token subsample cap per step (T4 cost control)

# Training hyperparameters (Appendix A)
# Canonical owners: peak LR lives in model.lr, decay in optimizer.weight_decay;
# optimizer.lr (if present) is ignored by the JEPA path. total_steps is the
# paper budget reference; the schedule is warmup-then-constant.
ema_decay: 0.99925
lr: 5.25e-4
weight_decay: 0.04  # duplicate of optimizer.weight_decay (informational)
warmup_steps: 12000          # linear LR warmup, stepped every optimizer update
total_steps: 135000          # reference only (schedule ignores it)