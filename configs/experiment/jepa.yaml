# V-JEPA 2.1 ConvGamer experiment config
# Implements: arXiv:2603.14482 "V-JEPA 2.1: Unlocking Dense Features"
# ConvGamer (InceptionNeXt multi-scale depthwise convolutions) backbone
# instead of ViT, for ConvNeXt-Tiny scale (~35M params) on 2x T4.
#
# Usage:
#   uv run train experiment=jepa model=jepa data=jepa trainer=jepa \
#       optimizer=jepa

# Training
seed: 42
fast_dev_run: false