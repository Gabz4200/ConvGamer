fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.1
    hooks:
      - id: pyrefly-check
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/christophmeissner/pytest-pre-commit
    rev: 1.0.0
    hooks:
      - id: pytest
        name: pytest suite
        # Run with the project env (plugins + package installed) via uv.
        entry: uv run --no-sync pytest -q
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/scanaislop/aislop
    rev: v0.16.1
    hooks:
      - id: aislop
